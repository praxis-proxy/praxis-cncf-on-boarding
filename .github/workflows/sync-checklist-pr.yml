name: Sync checklist on PR merge

# Update ONBOARDING.md / README.md only after merge so open PRs do not race
# each other checking boxes on shared lines (merge conflicts). One commit
# covers every Closes #N in the merged PR body.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: sync-checklist-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-checklist-on-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'github-actions[bot]'
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse closing issues and update checklist
        id: link
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          issues="$(python3 -c "
          import os, sys
          sys.path.insert(0, 'scripts')
          from checklist_tracking import parse_closing_issues
          print(' '.join(str(n) for n in parse_closing_issues(os.environ.get('PR_BODY') or '')))
          ")"

          if [ -z "${issues}" ]; then
            echo "No closing keywords found in PR body; skipping checklist sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "issues=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "issues=${issues}" >> "$GITHUB_OUTPUT"
          echo "Closing issues from PR #${PR_NUMBER}: ${issues}"

          # Ensure every referenced issue is closed (GitHub only auto-closes
          # when each number has its own keyword; comma lists need a nudge).
          for n in ${issues}; do
            state="$(gh issue view "${n}" -R "${REPO}" --json state -q .state 2>/dev/null || true)"
            if [ "${state}" = "OPEN" ]; then
              gh issue close "${n}" -R "${REPO}" \
                --comment "Closed by merge of #${PR_NUMBER}."
            fi
          done

          python3 scripts/checklist_tracking.py link-pr \
            --repo "${REPO}" \
            --pr-number "${PR_NUMBER}" \
            --issue-numbers ${issues}

          if git diff --quiet ONBOARDING.md README.md; then
            echo "No checklist tracking changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit checklist update to main
        if: steps.link.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ONBOARDING.md README.md
          git commit -m "docs: mark checklist items complete for PR #${{ github.event.pull_request.number }}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
