name: Validate PR closes checklist issues

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  comment-missing-closes:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    steps:
      - name: Check for closing keywords
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const closesPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const matches = [...body.matchAll(closesPattern)];

            if (matches.length > 0) {
              core.info(`PR references issues: ${matches.map(m => '#' + m[1]).join(', ')}`);
              return;
            }

            const marker = '<!-- checklist-closes-reminder -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            if (comments.some(c => c.body && c.body.includes(marker))) {
              core.info('Reminder comment already present; skipping.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                marker,
                '### Checklist reminder',
                '',
                'This PR does not reference any checklist issues with closing keywords.',
                '',
                'After merge, automation checks the box and links this PR. Add one keyword per issue:',
                '',
                '```',
                'Closes #123',
                'Closes #456',
                '```',
                '',
                'See [CONTRIBUTING.md](CONTRIBUTING.md) for the full workflow.'
              ].join('\n')
            });
